<!doctype html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css">
<title>ClashCoach</title></head>
<body>
<header><div class="logo">🏰</div><div><h1>ClashCoach</h1><p>Screenshot → attack plan</p></div></header>
<nav><button class="active" data-tab="coach">⚔️ Coach</button><button data-tab="saved">⭐ Saved</button></nav>
<main>
<section id="coach">
<div class="card upload"><h2>Upload enemy base</h2><p>Send a clear screenshot of the whole base.</p>
<input id="file" type="file" accept="image/*"><label for="file">📸 Choose Screenshot</label><img id="preview" hidden></div>
<div class="card"><h2>Your army</h2><div class="chips"><button data-army="Hybrid">⛏️ Hybrid</button><button data-army="LaLo">🎈 LaLo</button><button data-army="Queen Charge">👑 Queen Charge</button><button data-army="Root Riders">🌳 Root Riders</button></div>
<p id="armyText">Choose your army so the coach can tailor the plan.</p></div>
<button class="primary" id="analyze">🔎 Analyze Base</button>
<div id="result" class="card result hidden"></div>
</section>
<section id="saved" class="hidden"><div class="card"><h2>Saved attacks</h2><p>Your saved attack plans will appear here.</p></div></section>
</main>
<script src="app.js"></script></body></html>
